<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="ABS Cafe &amp; Accessories — Smart Point of Sale &amp; Customer Platform" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2314"/>
      <stop offset="0.6" stop-color="#4B2E1E"/>
      <stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C68B3E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3B56B"/>
      <stop offset="1" stop-color="#C68B3E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="130" y="95" width="0" height="70">
        <animate attributeName="width" from="0" to="640" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="230" rx="18" fill="url(#bg)"/>

  <!-- cangkir -->
  <g fill="#F5E6CC">
    <rect x="425" y="48" width="50" height="34" rx="9"/>
    <rect x="414" y="86" width="72" height="5" rx="2.5"/>
    <path d="M475 55 h8 a8 8 0 0 1 0 16 h-8" fill="none" stroke="#F5E6CC" stroke-width="4"/>
  </g>
  <!-- uap -->
  <g fill="none" stroke="#E3B56B" stroke-width="3" stroke-linecap="round">
    <path d="M438 42 c-7 -6 7 -11 0 -18">
      <animate attributeName="opacity" values="0;0.85;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -4" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M450 42 c-7 -6 7 -11 0 -18">
      <animate attributeName="opacity" values="0;0.85;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -4" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M462 42 c-7 -6 7 -11 0 -18">
      <animate attributeName="opacity" values="0;0.85;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -4" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- judul (terbuka dari kiri ke kanan) -->
  <g clip-path="url(#reveal)">
    <text x="450" y="148" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F5E6CC">ABS Cafe &amp; Accessories</text>
  </g>

  <!-- subjudul -->
  <text x="450" y="182" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" letter-spacing="1" fill="#F5E6CC" opacity="0">
    Smart Point of Sale &amp; Customer Platform
    <animate attributeName="opacity" from="0" to="0.9" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- garis kilau -->
  <rect x="250" y="200" width="400" height="3" rx="1.5" fill="url(#bar)" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
